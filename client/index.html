<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>JWP Books</title>
    <meta name="description" content="JWP Books — customer and service management for John Willis Piano." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f1117" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JWP Books" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon: the small file is a simplified render (fewer keys, bolder decal)
         because the full logo turns to mush below ~32px. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=4" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=4" />

    <!-- Fonts (only the 3 actually used) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
